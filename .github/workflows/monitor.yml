name: monitoraggio dati e pubblicazione

on:
  schedule:
    - cron: "30 4 * * *"      # ogni giorno alle 06:30 ora italiana (estate) / 05:30 (inverno)
  workflow_dispatch:
  push:
    paths: ["app/**"]

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- aggiornamenti automatici dei dati numerici (fonti ufficiali in formato certo) ----
      - name: Indice FOI dall'API ISTAT
        id: foi
        run: |
          set +e; node app/scripts/update_foi.js | tee foi.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Tasso BCE per gli interessi di mora
        id: bce
        run: |
          set +e; node app/scripts/update_bce.js | tee bce.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Saggio degli interessi legali dal decreto MEF
        id: saggio
        run: |
          set +e; node app/scripts/update_saggio.js | tee saggio.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      # ---- rilevamento delle novità da esaminare ----
      - name: Gazzetta Ufficiale
        id: gu
        run: |
          set +e; node app/scripts/check_gazzetta.js | tee gu.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      # La Cassazione (Italgiure) accetta solo connessioni dall'Italia: il controllo gira sul PC
      # (app/scripts/locale_cassazione.js, Utilità di pianificazione di Windows) e apre da lì le segnalazioni.

      - name: Scadenziario dei dati periodici
        id: scad
        run: |
          set +e; node app/scripts/check_scadenze.js | tee scad.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      # ---- collaudo: se fallisce non si pubblica ----
      - name: Test dei motori di calcolo
        run: node app/tests/run_tests.js

      - name: Test dell'interfaccia
        run: |
          npm install --no-save --silent jsdom@24
          node app/tests/run_dom_tests.js

      - name: Timbro e build
        run: |
          node app/scripts/stamp.js dati "$(TZ=Europe/Rome date +%d/%m/%Y)"
          node app/build.js

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name "calcoliforensi-monitor"
          git config user.email "monitor@calcoliforensi.it"
          git add -A app docs monitoraggio
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          msg="monitor: verifica automatica $(TZ=Europe/Rome date +%d/%m/%Y)"
          [ "${{ steps.foi.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 foi.log)"
          [ "${{ steps.bce.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 bce.log)"
          [ "${{ steps.saggio.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 saggio.log)"
          git commit -m "$msg"
          git pull --rebase --autostash origin main || true
          git push

      # ---- segnalazioni (email al titolare del repository) ----
      - name: Segnala le novità
        if: steps.gu.outputs.code == '10' || steps.scad.outputs.code == '10' || steps.bce.outputs.code == '2' || steps.foi.outputs.code == '1' || steps.bce.outputs.code == '1' || steps.saggio.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oggi="$(TZ=Europe/Rome date +%d/%m/%Y)"
          node app/scripts/report_issue.js > issue.md
          gh issue create --title "Monitoraggio $oggi: novità da esaminare" --body-file issue.md

      - name: Verifica che il sito risponda
        run: sleep 90 && node app/scripts/check_site.js
