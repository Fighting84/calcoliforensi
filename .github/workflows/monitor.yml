name: monitoraggio dati e pubblicazione

on:
  schedule:
    - cron: "30 4 * * *"      # ogni giorno alle 06:30 ora italiana (estate) / 05:30 (inverno)
  workflow_dispatch:
  push:
    paths: ["app/**"]

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Aggiorna serie FOI dall'API ISTAT
        id: foi
        run: |
          set +e
          node app/scripts/update_foi.js | tee foi.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then echo "::warning::update_foi in errore (API ISTAT non raggiungibile?)"; fi
          exit 0

      - name: Test dei motori di calcolo
        run: node app/tests/run_tests.js

      - name: Timbro verifica automatica e build
        run: |
          node app/scripts/stamp.js dati "$(TZ=Europe/Rome date +%d/%m/%Y)"
          node app/build.js

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name "calcoliforensi-monitor"
          git config user.email "monitor@calcoliforensi.it"
          git add -A app docs
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          msg="monitor: verifica automatica $(TZ=Europe/Rome date +%d/%m/%Y)"
          if [ "${{ steps.foi.outputs.code }}" = "10" ]; then msg="monitor: nuovo indice FOI ISTAT — $(cat foi.log | tail -n 1)"; fi
          git commit -m "$msg"
          git push

      - name: Verifica che il sito risponda
        run: sleep 90 && node app/scripts/check_site.js
