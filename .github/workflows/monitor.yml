name: monitoraggio dati e pubblicazione

on:
  schedule:
    - cron: "30 4 * * *"      # ogni giorno alle 06:30 ora italiana (estate) / 05:30 (inverno)
  workflow_dispatch:
  push:
    paths: ["app/**"]

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- aggiornamenti automatici dei dati numerici (fonti ufficiali in formato certo) ----
      - name: Indice FOI dall'API ISTAT
        id: foi
        run: |
          set +e; node app/scripts/update_foi.js | tee foi.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Tasso BCE per gli interessi di mora
        id: bce
        run: |
          set +e; node app/scripts/update_bce.js | tee bce.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Tassi soglia antiusura (Banca d'Italia)
        id: usura
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          set +e; node app/scripts/update_usura.js | tee usura.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Saggio degli interessi legali dal decreto MEF
        id: saggio
        run: |
          set +e; node app/scripts/update_saggio.js | tee saggio.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      # ---- rilevamento delle novità da esaminare ----
      - name: Gazzetta Ufficiale
        id: gu
        run: |
          set +e; node app/scripts/check_gazzetta.js | tee gu.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Testi della Gazzetta richiesti dalla routine
        run: node app/scripts/scarica_richieste.js || true

      # Cassazione (Italgiure): verificato il 30/09/2026 che il server non accetta connessioni dai server
      # di GitHub (timeout). Il controllo gira sul PC con l'Utilità di pianificazione di Windows
      # (monitoraggio/cassazione_locale.cmd → app/scripts/locale_cassazione.js) e apre da lì le segnalazioni.

      - name: Norme sentinella (testo vigente su Normattiva)
        id: norme
        run: |
          set +e; node app/scripts/check_norme.js | tee norme.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Servizio dei cambi della Banca d'Italia
        id: cambi
        run: |
          set +e; node app/scripts/check_cambi.js | tee cambi.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Codici tributo del ravvedimento (banca dati Agenzia delle entrate)
        id: cod
        run: |
          set +e; node app/scripts/check_codici.js | tee cod.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      - name: Scadenziario dei dati periodici
        id: scad
        run: |
          set +e; node app/scripts/check_scadenze.js | tee scad.log; echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"; exit 0

      # ---- collaudo: se fallisce non si pubblica ----
      - name: Test dei motori di calcolo
        run: node app/tests/run_tests.js

      - name: Test dell'interfaccia
        run: |
          npm install --no-save --silent jsdom@24
          node app/tests/run_dom_tests.js

      - name: Timbro e build
        run: |
          node app/scripts/stamp.js dati "$(TZ=Europe/Rome date +%d/%m/%Y)"
          node app/build.js

      - name: Pubblica se qualcosa è cambiato
        run: |
          git config user.name "calcoliforensi-monitor"
          git config user.email "monitor@calcoliforensi.it"
          git add -A app docs monitoraggio
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          msg="monitor: verifica automatica $(TZ=Europe/Rome date +%d/%m/%Y)"
          [ "${{ steps.foi.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 foi.log)"
          [ "${{ steps.bce.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 bce.log)"
          [ "${{ steps.saggio.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 saggio.log)"
          [ "${{ steps.usura.outputs.code }}" = "10" ] && msg="$msg — $(tail -n 1 usura.log)"
          git commit -m "$msg"
          git pull --rebase --autostash origin main || true
          git push

      # ---- segnalazioni (email al titolare del repository) ----
      - name: Segnala le novità
        if: steps.gu.outputs.code == '10' || steps.cod.outputs.code == '10' || steps.norme.outputs.code == '10' || steps.norme.outputs.code == '1' || steps.usura.outputs.code == '1' || steps.usura.outputs.code == '2' || steps.cambi.outputs.code == '1' || steps.cod.outputs.code == '1' || steps.cass.outputs.code == '10' || steps.cass.outputs.code == '1' || steps.scad.outputs.code == '10' || steps.bce.outputs.code == '2' || steps.foi.outputs.code == '1' || steps.bce.outputs.code == '1' || steps.saggio.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oggi="$(TZ=Europe/Rome date +%d/%m/%Y)"
          node app/scripts/report_issue.js > issue.md
          gh issue create --title "Monitoraggio $oggi: novità da esaminare" --body-file issue.md

      - name: Esiti della routine settimanale sulle segnalazioni
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node app/scripts/applica_esiti.js
          git add monitoraggio/esiti.json
          if ! git diff --cached --quiet; then git commit -m "monitor: esiti applicati" && git pull --rebase --autostash origin main && git push; fi

      - name: Azioni per il titolare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node app/scripts/check_azioni.js --sincronizza

      - name: Verifica che il sito risponda
        run: sleep 90 && node app/scripts/check_site.js
